appId: com.aiworkflowstudio.agent
productName: AI Workflow Studio Agent
asar: true
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - package.json
  - '!node_modules/@ai-workflow-studio/**'
  - '!node_modules/**/*.{test,spec}.{js,ts,tsx}'
  - '!node_modules/**/*.map'
mac:
  artifactName: AI-Workflow-Studio-Agent-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  notarize: true
  target:
    - dmg
    - zip
win:
  artifactName: AI-Workflow-Studio-Agent-${version}-windows-${arch}.${ext}
  target:
    - nsis
linux:
  artifactName: AI-Workflow-Studio-Agent-${version}-linux-${arch}.${ext}
  category: Office
  target:
    - AppImage
publish:
  provider: github
  owner: erin20080306
  repo: AI-Workflow-Studio
electronUpdaterCompatibility: '>=2.16'
npmRebuild: false
