appId: com.aiworkflowstudio.agent
productName: AI Workflow Studio Agent
asar: true
directories:
  output: release
files:
  - dist/**
  - package.json
mac:
  artifactName: AI-Workflow-Studio-Agent-${version}-${arch}-UNSIGNED-DEV.${ext}
  category: public.app-category.productivity
  hardenedRuntime: true
  identity: null
  target:
    - dmg
    - zip
win:
  artifactName: AI-Workflow-Studio-Agent-${version}-${arch}-UNSIGNED-DEV.${ext}
  target:
    - nsis
linux:
  artifactName: AI-Workflow-Studio-Agent-${version}-${arch}-UNSIGNED-DEV.${ext}
  category: Office
  target:
    - AppImage
publish:
  provider: github
  owner: erin20080306
  repo: AI-Workflow-Studio
electronUpdaterCompatibility: '>=2.16'
npmRebuild: false
