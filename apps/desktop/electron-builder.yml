appId: com.aiworkflowstudio.agent
productName: AI Workflow Studio Agent
asar: true
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - package.json
  - '!node_modules/@ai-workflow-studio/**'
  - '!node_modules/**/*.{test,spec}.{js,ts,tsx}'
  - '!node_modules/**/*.map'
# Bundle a headless LibreOffice so the formatting-preserving workbook combine
# engine needs no separate customer install. CI must stage the platform's
# LibreOffice under build/libreoffice/ before packaging (see docs/EXCEL_MERGE_ENGINE.md).
# It lands at Resources/libreoffice/ and is resolved by resolveSofficePath.
extraResources:
  - from: build/libreoffice
    to: libreoffice
    filter:
      - '**/*'
mac:
  artifactName: AI-Workflow-Studio-Agent-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  extendInfo:
    NSAppleEventsUsageDescription: AI Workflow Studio uses approved Apple Events only to visibly operate Microsoft Excel after local opt-in.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  notarize: true
  target:
    - dmg
    - zip
win:
  artifactName: AI-Workflow-Studio-Agent-${version}-windows-${arch}.${ext}
  target:
    - nsis
linux:
  artifactName: AI-Workflow-Studio-Agent-${version}-linux-${arch}.${ext}
  category: Office
  target:
    - AppImage
publish:
  provider: github
  owner: erin20080306
  repo: AI-Workflow-Studio
electronUpdaterCompatibility: '>=2.16'
npmRebuild: false
